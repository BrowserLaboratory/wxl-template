name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM modules
        run: pnpm wasm:build

      - name: Generate challenge keys
        run: pnpm challenge:keygen

      - name: Run Rust/WASM tests
        run: pnpm wasm:test

      - name: Run tests
        run: pnpm test --run

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM modules
        run: pnpm wasm:build

      - name: Generate challenge keys
        run: pnpm challenge:keygen

      - name: Validate challenge frontmatter
        run: pnpm challenge:validate

      - name: Build VitePress site
        run: pnpm docs:build

  prose-audit:
    # PR-time deterministic prose audit on changed outward-facing markdown.
    # Guarded to pull_request because the base-vs-head diff needs github.base_ref,
    # which is empty on push events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/prose-audit/requirements.txt

      - name: Install prose-audit dependencies
        run: pip install -r scripts/prose-audit/requirements.txt

      - name: Compute changed outward markdown
        id: diff
        run: |
          git fetch origin "${{ github.base_ref }}"
          # Single space-separated line: each path becomes a positional arg to run.py.
          # A multi-line value would split across shell lines and run later paths as commands.
          CHANGED=$(git diff --name-only --diff-filter=AMR -M "origin/${{ github.base_ref }}...HEAD" -- '*.md' | tr '\n' ' ')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Run Phase-1 prose audit
        # SECURITY (CWE-78 script injection): the changed-file list is
        # attacker-controllable — a fork PR can add a markdown file whose NAME
        # contains shell metacharacters (git filenames allow any byte but / and
        # NUL, and `git diff --name-only` does not escape ASCII $ ( ) ; | & `).
        # It MUST NOT be spliced into `run:` via `${{ }}`, because Actions
        # macro-expands that into the script body BEFORE bash parses it, so a
        # name like `x$(curl…|bash)y.md` would execute. Passing it through `env:`
        # keeps it as DATA: a shell variable's value is never re-parsed for
        # command substitution. `set -f` disables globbing so the intentional
        # unquoted word-split (one file → one positional arg) stays data-only.
        env:
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: |
          set -f
          python scripts/prose-audit/run.py $CHANGED_FILES \
            --out audit-runs/prose-phase1-ci/ \
            --json-summary audit-runs/prose-phase1-ci/summary.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: prose-audit-phase1-reports
          path: audit-runs/prose-phase1-ci/
          retention-days: 14

  site-smoke:
    # Advisory browser smoke against the built+previewed site. Runs in parallel
    # with test/build/prose-audit (no needs:). NOT in the branch-protection
    # required-status-checks list — a failure here does not block merge. Job ID
    # is kept stable so a future change can promote it to a required check.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install wasm-pack
        uses: taiki-e/install-action@213ccc1a076163c093f914550b94feb90fab916d # v2.79.2
        with:
          tool: wasm-pack@0.14.0  # Pinned per spec ci-quality-gates: CI workflows install build toolchain at fixed versions

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM modules
        run: pnpm wasm:build

      - name: Generate challenge keys
        run: pnpm challenge:keygen

      - name: Build VitePress site
        run: pnpm docs:build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run site-smoke tests
        run: pnpm test:smoke

  spec-gates:
    # PR-time spec-drift gates: statements this change falsified without editing.
    # Guarded to pull_request for the same reason as prose-audit — the gates diff
    # base against head, and github.base_ref is empty on push events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/spec-gates/requirements.txt

      - name: Install spec-gates dependencies
        run: pip install -r scripts/spec-gates/requirements.txt

      - name: Run the gate script's own tests
        run: python scripts/spec-gates/test_run.py

      - name: Resolve the change id from the diff
        id: change
        # SECURITY (CWE-78 script injection): every value below that a fork PR can
        # influence reaches the shell through env: rather than ${{ }}, because
        # Actions macro-expands ${{ }} into the script body before bash parses it
        # — the same reasoning documented on prose-audit.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -f
          git fetch origin "$BASE_REF"
          # The id must come from what this PR changed. Reading it from whichever
          # directory happens to sit under openspec/changes/ binds an unrelated PR
          # to whatever change is live on the base branch at the time.
          IDS=$(python scripts/spec-gates/run.py --resolve-change --base "origin/$BASE_REF")
          COUNT=$(printf '%s' "$IDS" | grep -c . || true)
          # A directory name may contain newlines, which would inject extra keys
          # into $GITHUB_OUTPUT. Emit only an id matching a conservative charset.
          if [ "$COUNT" = "1" ] && printf '%s' "$IDS" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "id=$IDS" >> "$GITHUB_OUTPUT"
          else
            echo "id=" >> "$GITHUB_OUTPUT"
            echo "Resolved $COUNT change directories from the diff; skipping the gates."
          fi

      - name: Run spec-drift gates
        if: steps.change.outputs.id != ''
        env:
          CHANGE_ID: ${{ steps.change.outputs.id }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -f
          python scripts/spec-gates/run.py "$CHANGE_ID" --base "origin/$BASE_REF"
